<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Yuan · Know Your Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c0f;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      background-image: radial-gradient(circle at 30% 40%, rgba(180, 140, 70, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(160, 120, 50, 0.05) 0%, transparent 50%);
    }
    .portal {
      width: 100%;
      max-width: 480px;
      background: rgba(12, 14, 18, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(200, 160, 80, 0.25);
      border-radius: 2.5rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(220, 180, 100, 0.2);
      position: relative;
    }
    .logotype {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #d4b56c;
      text-shadow: 0 0 20px rgba(180, 140, 60, 0.5);
      text-transform: uppercase;
    }
    .tagline {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: rgba(180, 150, 100, 0.7);
      margin-top: 0.2rem;
      text-transform: uppercase;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200, 160, 80, 0.5), rgba(200, 160, 80, 0.2), transparent);
      margin: 0.5rem 0 1rem;
    }
    .form { display: flex; flex-direction: column; gap: 1.5rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
    label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: rgba(200, 165, 90, 0.8);
      text-transform: uppercase;
    }
    input, select {
      background: rgba(20, 22, 26, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(180, 140, 70, 0.3);
      border-radius: 1.2rem;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      color: #e0d3b8;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus {
      border-color: #d4a745;
      box-shadow: 0 0 18px rgba(200, 150, 50, 0.25);
    }
    .birth-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8rem; }
    .cta-button {
      background: rgba(30, 32, 38, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid #c9a44b;
      color: #ebd7a8;
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 1rem;
      border-radius: 3rem;
      cursor: pointer;
      margin-top: 0.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .cta-button:hover {
      background: #2a2d35;
      border-color: #e5ba56;
      color: #f5e7c6;
      box-shadow: 0 0 28px rgba(200, 150, 40, 0.5);
    }
    .footer-haiku { margin-top: 1.5rem; text-align: center; }
    .haiku-line {
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      color: rgba(180, 150, 100, 0.55);
      text-transform: uppercase;
      line-height: 1.7;
    }
    /* 本命总纲弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .modal-card {
      background: rgba(15, 17, 22, 0.95);
      border: 1px solid rgba(200, 160, 80, 0.4);
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      max-width: 500px;
      text-align: center;
    }
    .modal-card h2 {
      color: #d4b56c;
      font-weight: 300;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }
    .modal-card p {
      color: #c0b28a;
      line-height: 1.8;
      font-weight: 300;
      margin-bottom: 2rem;
    }
    .close-btn {
      background: transparent;
      border: 1px solid rgba(200, 160, 80, 0.5);
      color: #d4b56c;
      padding: 0.8rem 2rem;
      border-radius: 3rem;
      cursor: pointer;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="portal">
    <div class="logotype">源</div>
    <div class="tagline">know your code · run your life</div>
    <div class="divider"></div>
    <form class="form" onsubmit="event.preventDefault(); showModal();">
      <div class="input-group">
        <label>Birth Date · 诞辰</label>
        <input type="date" id="birthDate" value="1990-01-01" required>
      </div>
      <div class="input-group">
        <label>Exact Time · 时痕</label>
        <input type="time" id="birthTime" value="12:00" required>
      </div>
      <div class="input-group">
        <label>Place of Birth · 地脉</label>
        <input type="text" id="birthPlace" placeholder="City, Country · e.g. Berlin, Germany" required>
      </div>
      <button class="cta-button" type="submit">Decode · 解码</button>
    </form>
    <div class="footer-haiku">
      <div class="haiku-line">from void, the signal rises</div>
      <div class="haiku-line">stars aligned in code</div>
      <div class="haiku-line">your origin speaks</div>
    </div>
  </div>

  <!-- 本命总纲弹窗 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <h2>Your Cosmic Code</h2>
      <p id="modalText">You are a Visionary Architect, here to design new realities from the blueprint of your soul...</p>
      <button class="close-btn" onclick="closeModal()">Continue · 继续</button>
    </div>
  </div>

  <script>
    function showModal() {
      document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
